############################
## HUGO MODULES
## Docs: https://gohugo.io/hugo-modules/
############################

imports:
  - path: github.com/HugoBlox/kit/modules/blox
  - path: github.com/HugoBlox/kit/modules/integrations/netlify

mounts:
  # Locally-authored blocks. Kit has no tag-cloud block, so this site ships one.
  - source: hugo-blox/blox/all-access
    target: layouts/_partials/hbx/blocks
    files:
      - '**/block.html'
  # Site CSS. css.html concatenates everything here into the Tailwind entry,
  # so these files are processed by Tailwind (@apply and friends work).
  - source: hugo-blox/blox
    target: assets/dist/community/blox
    files:
      - '**/*.css'
  - source: layouts
    target: layouts
  - source: assets
    target: assets
