role: A Trypanosome in the Shell
bio: "Our laboratory is interested in the study of human pathogens, particularly\ntrypanosomes and also\
  \ others that cause so-called *Neglected Tropical Diseases*. \n\nWe develop computational tools and\
  \ produce (and re-use) large data sets to\nformulate and guide our research hypotheses in the quest\
  \ for new drugs and\ndiagnostics. Smart and intensive data integration, data mining,\nand high-throughput\
  \ assays and experiments are at the core of our research\nactivities.\n\nIn particular, we have a special\
  \ interest in the study of trypanosomes such as\n_Trypanosoma cruzi_ (causative of Chagas disease).\
  \ \n\nWellcome to our electronic home in the web. Feel free to browse and poke\naround."
